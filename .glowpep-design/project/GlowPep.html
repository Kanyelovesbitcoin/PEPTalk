<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlowPep — Specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<style>
:root {
  --bg: #0B0A08;
  --bg2: #131210;
  --ink: #EFE7D2;
  --ink2: rgba(239,231,210,0.55);
  --ink3: rgba(239,231,210,0.30);
  --ink4: rgba(239,231,210,0.12);
  --rule: rgba(239,231,210,0.10);
  --rule-bold: rgba(239,231,210,0.22);
  --gold: #D4A84B;
  --gold-deep: #8B6F2D;
  --gold-soft: #E8C97A;
  --jade: #A8C99A;
  --jade-deep: #6B9460;
  --jade-glow: rgba(168,201,154,0.25);
  --crimson: #E0623F;
  --display: 'Bricolage Grotesque', sans-serif;
  --body: 'Geist', sans-serif;
  --mono: 'Geist Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #050402; min-height: 100vh; font-family: var(--body); overscroll-behavior: none; }
body {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  overflow-x: auto;
  background:
    radial-gradient(ellipse 60% 80% at 20% 0%, rgba(212,168,75,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 50% 70% at 80% 100%, rgba(168,201,154,0.025) 0%, transparent 50%),
    #050402;
}
.stage { display: flex; gap: 36px; padding: 56px 56px; align-items: flex-start; }
.phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.phone-tag {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(239,231,210,0.4);
}
.phone-tag .num {
  background: rgba(239,231,210,0.06);
  border: 1px solid rgba(239,231,210,0.12);
  padding: 2px 6px;
  border-radius: 2px;
  color: var(--gold);
  font-weight: 600;
}

/* SCREEN BASE */
.s {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-feature-settings: "tnum" 1, "ss01" 1;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  letter-spacing: -0.005em;
}
.s::before {
  /* film grain */
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.94 0 0 0 0 0.91 0 0 0 0 0.82 0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.7;
  mix-blend-mode: overlay;
  z-index: 1;
}
.s > * { position: relative; z-index: 2; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-bottom: 100px; }
.scroll::-webkit-scrollbar { display: none; }
.statusbar { height: 44px; flex-shrink: 0; }

/* ── EDITORIAL TYPE ── */
.eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink3);
}
.eyebrow .dot {
  display: inline-block; width: 5px; height: 5px;
  border-radius: 50%; background: var(--gold);
  margin-right: 6px; vertical-align: middle;
  box-shadow: 0 0 0 2px rgba(212,168,75,0.15);
}
.eyebrow.acid .dot { background: var(--jade); box-shadow: 0 0 0 2px rgba(168,201,154,0.15); }

/* hairline rule */
.hr { height: 1px; background: var(--rule); width: 100%; }
.hr-bold { height: 1px; background: var(--rule-bold); width: 100%; }

/* ── NAV ── */
.tabs {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 88px;
  background: linear-gradient(to top, rgba(11,10,8,0.98) 60%, rgba(11,10,8,0));
  z-index: 50;
  display: flex; align-items: flex-start;
  padding: 14px 18px 0;
  border-top: 1px solid var(--rule);
  backdrop-filter: blur(20px);
}
.tabs-inner { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer;
  padding: 4px 8px;
}
.tab svg { width: 20px; height: 20px; color: var(--ink3); transition: all 0.2s; stroke-width: 1.5; }
.tab span {
  font-family: var(--mono); font-size: 9px; font-weight: 500;
  letter-spacing: 0.12em; color: var(--ink3); text-transform: uppercase;
  transition: color 0.2s;
}
.tab.active svg { color: var(--gold); }
.tab.active span { color: var(--gold); }
.tab.active::after {
  content: ""; position: absolute; bottom: 0; width: 24px; height: 1px;
  background: var(--gold); margin-top: 4px;
}

/* ── HERO NUMERAL ── */
.hero-num {
  font-family: var(--display);
  font-weight: 800;
  font-size: 144px;
  line-height: 0.85;
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.hero-num .small {
  font-size: 32px;
  color: var(--ink3);
  font-weight: 500;
  letter-spacing: -0.02em;
  vertical-align: top;
  display: inline-block;
  margin-top: 12px;
  margin-left: 4px;
}

/* dotted meter */
.dotmeter { display: inline-flex; gap: 3px; }
.dotmeter .d {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ink4);
}
.dotmeter .d.on { background: var(--gold); }
.dotmeter .d.acid { background: var(--jade); }

/* segment bar */
.segbar { display: flex; gap: 2px; height: 4px; }
.segbar .seg { flex: 1; background: var(--ink4); border-radius: 1px; }
.segbar .seg.on { background: var(--gold); }
.segbar .seg.acid { background: var(--jade); }

/* spec table */
.spec { display: grid; grid-template-columns: 1fr auto; gap: 0; }
.spec .row {
  display: contents;
}
.spec .k {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink3);
  padding: 12px 0;
  border-bottom: 1px solid var(--rule);
}
.spec .v {
  font-family: var(--body); font-size: 13px; font-weight: 500;
  color: var(--ink); text-align: right;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule);
  font-variant-numeric: tabular-nums;
}

/* button */
.btn {
  width: 100%;
  height: 56px;
  background: var(--ink);
  color: var(--bg);
  border: none;
  font-family: var(--body); font-size: 14px; font-weight: 600;
  letter-spacing: 0.02em;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.2s;
}
.btn:hover { background: var(--gold); }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--rule-bold);
}
.btn-ghost:hover { background: var(--ink4); border-color: var(--ink); }
.btn .arrow {
  font-family: var(--mono); font-weight: 400;
  transition: transform 0.2s;
}
.btn:hover .arrow { transform: translateX(4px); }

/* ─── SCAN: CINEMATIC ─── */
.scan-screen { background: #050402; }
.scan-vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 50% at 50% 45%, transparent 0%, rgba(5,4,2,0.7) 100%);
  pointer-events: none;
}
@keyframes pulse {
  0%, 100% { opacity: 0.7; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.02); }
}
.face-oval {
  animation: pulse 2.6s ease-in-out infinite;
}
@keyframes scanline {
  0% { transform: translateY(-200px); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { transform: translateY(200px); opacity: 0; }
}
.scanline {
  position: absolute; left: 50%; top: 50%;
  width: 240px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  transform: translateX(-50%) translateY(-50%);
  animation: scanline 3.4s ease-in-out infinite;
  filter: blur(0.5px);
}

/* tick marks */
.ticks { display: flex; gap: 0; align-items: center; }
.ticks .tk { width: 1px; height: 8px; background: var(--ink4); }
.ticks .tk.on { background: var(--gold); height: 12px; }

/* badge / pill */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 9px;
  font-weight: 500; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink2);
  padding: 4px 8px;
  border: 1px solid var(--rule-bold);
  border-radius: 2px;
}
.pill.gold { color: var(--gold); border-color: rgba(212,168,75,0.4); }
.pill.acid { color: var(--jade); border-color: rgba(168,201,154,0.4); }
.pill.solid {
  background: var(--ink); color: var(--bg); border: none;
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── ICONS — custom 1.5px line set ─── */
const I = {
  home: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1z"/></svg>,
  flask: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 3h6M10 3v7l-5 9a1.5 1.5 0 001.3 2.2h11.4A1.5 1.5 0 0019 19l-5-9V3"/><path d="M7.5 14h9"/></svg>,
  scan: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"/><circle cx="12" cy="12" r="3.5"/></svg>,
  log: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>,
  book: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 3h13a1 1 0 011 1v15.5a1.5 1.5 0 01-1.5 1.5H6a1 1 0 01-1-1zM5 17h14"/></svg>,
  arrow: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/></svg>,
  arrowUp: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>,
  spark: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>,
  close: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>,
  flip: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 8a9 9 0 00-15-3L3 8M3 16a9 9 0 0015 3l3-3M3 4v4h4M21 20v-4h-4"/></svg>,
  search: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>,
  bookmark: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>,
  plus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  check: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="5 12 10 17 19 7"/></svg>,
  gallery: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,
};

/* ─── face profile illustration (custom hand-drawn line) ─── */
const FaceProfile = ({size = 110, stroke = 'var(--gold)', op = 1}) => (
  <svg width={size} height={size * 1.1} viewBox="0 0 110 120" fill="none" style={{opacity: op}}>
    <path d="M30 38 C30 22 42 12 56 12 C72 12 84 24 84 42 C84 50 82 56 80 60 L82 70 C82 73 80 74 77 74 L75 74 L75 86 C75 92 70 96 64 96 L52 96 L52 108"
      stroke={stroke} strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
    {/* eye */}
    <path d="M68 46 C70 44 74 44 76 46" stroke={stroke} strokeWidth="1.2" strokeLinecap="round"/>
    {/* nose */}
    <path d="M82 54 L78 64 L82 66" stroke={stroke} strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
    {/* mouth */}
    <path d="M70 80 C72 81 76 81 78 80" stroke={stroke} strokeWidth="1.2" strokeLinecap="round"/>
    {/* hair */}
    <path d="M30 38 C28 30 32 22 38 18 C44 14 56 10 66 12 C76 14 82 20 84 30"
      stroke={stroke} strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
    {/* dot markers */}
    <circle cx="56" cy="32" r="1" fill={stroke}/>
    <circle cx="62" cy="58" r="1" fill={stroke}/>
    <circle cx="64" cy="80" r="1" fill={stroke}/>
  </svg>
);

/* ─── TABS ─── */
function Tabs({ active }) {
  const items = [
    {id:'home', label:'Today', icon:I.home},
    {id:'stack', label:'Stack', icon:I.flask},
    {id:'scan', label:'Scan', icon:I.scan},
    {id:'log', label:'Log', icon:I.log},
    {id:'lib', label:'Library', icon:I.book},
  ];
  return (
    <div className="tabs">
      <div className="tabs-inner">
        {items.map(it => (
          <div key={it.id} className={`tab ${active===it.id?'active':''}`} style={{position:'relative'}}>
            {it.icon}
            <span>{it.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   HOME / TODAY
   ════════════════════════════════════════════════════════════ */
function Home() {
  return (
    <div className="s">
      <div className="statusbar"/>
      <div className="scroll">
        {/* Masthead */}
        <div style={{padding:'12px 22px 18px', display:'flex', alignItems:'flex-start', justifyContent:'space-between'}}>
          <div>
            <div style={{fontFamily:'var(--display)', fontSize:18, fontWeight:700, letterSpacing:'-0.02em'}}>
              Glow<span style={{fontWeight:400, color:'var(--gold)'}}>pep</span>
            </div>
            <div className="eyebrow" style={{marginTop:2}}>N°014 · WED 28 JAN</div>
          </div>
          <div style={{display:'flex', gap:8}}>
            <div style={{width:32, height:32, border:'1px solid var(--rule-bold)', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--ink2)'}}>
              {React.cloneElement(I.search, {style:{width:14, height:14}})}
            </div>
          </div>
        </div>
        <div className="hr-bold"/>

        {/* Hero score: editorial spread */}
        <div style={{padding:'24px 22px 20px', display:'grid', gridTemplateColumns:'1fr auto', gap:16, alignItems:'flex-start'}}>
          <div>
            <div className="eyebrow" style={{marginBottom:14}}><span className="dot"/>GLOW SCORE</div>
            <div className="hero-num">
              074<span className="small">/100</span>
            </div>
            <div style={{display:'flex', alignItems:'center', gap:8, marginTop:10}}>
              <span style={{fontFamily:'var(--mono)', fontSize:11, color:'var(--jade)', fontWeight:600}}>↑ +08</span>
              <span style={{fontFamily:'var(--mono)', fontSize:10, color:'var(--ink3)', letterSpacing:'0.1em'}}>VS LAST WEEK</span>
            </div>
          </div>
          <div style={{paddingTop:4}}>
            <FaceProfile size={96}/>
          </div>
        </div>

        <div className="hr"/>

        {/* Sub-metrics inline */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', borderBottom:'1px solid var(--rule)'}}>
          {[
            {k:'COLLAGEN', v:'73', d:'+04'},
            {k:'TEXTURE', v:'72', d:'+02'},
            {k:'LUMINOSITY', v:'78', d:'+06'},
          ].map((m,i,a) => (
            <div key={m.k} style={{padding:'18px 14px 16px', borderRight: i<a.length-1 ? '1px solid var(--rule)' : 'none'}}>
              <div className="eyebrow" style={{fontSize:9, marginBottom:8}}>{m.k}</div>
              <div style={{fontFamily:'var(--display)', fontSize:32, fontWeight:600, letterSpacing:'-0.03em', lineHeight:1, fontVariantNumeric:'tabular-nums'}}>{m.v}</div>
              <div style={{fontFamily:'var(--mono)', fontSize:10, color:'var(--jade)', marginTop:6, fontWeight:500}}>↑ {m.d}</div>
            </div>
          ))}
        </div>

        {/* Streak strip */}
        <div style={{padding:'18px 22px', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
          <div>
            <div className="eyebrow"><span className="dot"/>ACTIVE STREAK</div>
            <div style={{display:'flex', alignItems:'baseline', gap:8, marginTop:8}}>
              <span style={{fontFamily:'var(--display)', fontSize:42, fontWeight:700, letterSpacing:'-0.04em', lineHeight:1}}>14</span>
              <span style={{fontFamily:'var(--body)', fontSize:14, color:'var(--ink2)', fontWeight:500}}>days</span>
            </div>
          </div>
          {/* day dots */}
          <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, width:128}}>
            {Array.from({length:14}).map((_,i) => (
              <div key={i} style={{
                aspectRatio:'1', borderRadius:1,
                background: i<14 ? 'var(--gold)' : 'var(--ink4)',
                opacity: i<14 ? (0.45 + i/26) : 1,
              }}/>
            ))}
          </div>
        </div>
        <div className="hr-bold"/>

        {/* ── FORECAST PAYOFF — the "where you're heading" hero ── */}
        <div style={{padding:'24px 22px 8px', position:'relative'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:14}}>
            <div className="eyebrow"><span className="dot" style={{background:'var(--jade)', boxShadow:'0 0 0 2px rgba(168,201,154,0.2)'}}/>YOUR 12-WEEK FORECAST</div>
            <span style={{fontFamily:'var(--mono)', fontSize:10, color:'var(--jade)', fontWeight:600, letterSpacing:'0.1em'}}>ON TRACK</span>
          </div>
          <div style={{fontFamily:'var(--display)', fontSize:26, fontWeight:600, letterSpacing:'-0.025em', lineHeight:1.1, marginBottom:18}}>
            You're trending toward a <span style={{color:'var(--jade)'}}>92</span><span style={{color:'var(--ink3)'}}>/100</span>
            <br/><span style={{color:'var(--ink2)', fontWeight:500}}>top 4% glow score by April.</span>
          </div>

          {/* the transformation reveal */}
          <div style={{
            display:'grid', gridTemplateColumns:'1fr auto 1fr', gap:0, alignItems:'stretch',
            border:'1px solid var(--rule-bold)',
            background:'linear-gradient(135deg, rgba(168,201,154,0.04) 0%, rgba(212,168,75,0.06) 100%)',
            marginBottom:18, padding:0
          }}>
            {/* NOW */}
            <div style={{padding:'18px 16px', borderRight:'1px solid var(--rule)'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18}}>
                <span style={{fontFamily:'var(--mono)', fontSize:9, color:'var(--ink3)', letterSpacing:'0.18em'}}>NOW</span>
                <span style={{fontFamily:'var(--display)', fontSize:22, fontWeight:700, color:'var(--ink2)', letterSpacing:'-0.02em', lineHeight:1}}>74</span>
              </div>
              <div style={{display:'flex', justifyContent:'center', marginBottom:10}}>

              <span style={{
                fontFamily:'var(--mono)', fontSize:9,
                color: active === f.k ? 'var(--gold)' : 'var(--ink3)',
                background: active === f.k ? 'rgba(212,168,75,0.1)' : 'transparent',
                border:'1px solid',
                borderColor: active === f.k ? 'rgba(212,168,75,0.3)' : 'var(--rule)',
                padding:'1px 4px', borderRadius:1,
              }}>{f.n}</span>
            </div>
          ))}
        </div>
        <div className="hr-bold"/>

        {/* Peptide entries */}
        {peptides.map((p,i) => (
          <div key={p.n} style={{padding:'24px 22px', borderBottom:'1px solid var(--rule)'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:12}}>
              <div style={{display:'flex', alignItems:'center', gap:10}}>
                <span style={{fontFamily:'var(--mono)', fontSize:10, color:'var(--ink3)', letterSpacing:'0.16em'}}>N° {p.n}</span>
                <span className={`pill ${p.mode === 'crimson' ? '' : 'gold'}`} style={p.mode === 'crimson' ? {color:'var(--crimson)', borderColor:'rgba(224,98,63,0.4)'} : {}}>{p.status}</span>
              </div>
              <div style={{color:'var(--ink3)', cursor:'pointer'}}>
                {React.cloneElement(I.bookmark, {style:{width:16, height:16}})}
              </div>
            </div>
            <div style={{fontFamily:'var(--display)', fontSize:30, fontWeight:700, letterSpacing:'-0.03em', lineHeight:0.95, marginBottom:6}}>
              {p.name}
            </div>
            <div style={{fontFamily:'var(--body)', fontSize:13, color:'var(--ink3)', marginBottom:14, fontWeight:500, letterSpacing:'0.01em'}}>
              {p.aka}
            </div>
            <div style={{fontFamily:'var(--body)', fontSize:13, color:'var(--ink2)', lineHeight:1.55, marginBottom:18}}>
              {p.desc}
            </div>
            {/* spec table */}
            <div className="spec">
              <div className="k">Route</div><div className="v">{p.route}</div>
              <div className="k">Evidence</div><div className="v">{p.evidence}</div>
              <div className="k">Budget</div>
              <div className="v">
                <span className="dotmeter">
                  {Array.from({length:3}).map((_,j) => <span key={j} className={`d ${j < p.budget ? 'on':''}`}/>)}
                </span>
              </div>
            </div>
          </div>
        ))}
        <div style={{height:24}}/>
      </div>
      <Tabs active="lib"/>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   LOG — Daily check-in
   ════════════════════════════════════════════════════════════ */
function Log() {
  const [r, setR] = useState({Hydration:3, Texture:3, Glow:4, Sensitivity:2, Firmness:3});
  const labels = ['Poor','Off','Okay','Good','Glowing'];

  return (
    <div className="s">
      <div className="statusbar"/>
      <div className="scroll">
        {/* Masthead */}
        <div style={{padding:'12px 22px 18px'}}>
          <div className="eyebrow"><span className="dot"/>DAILY · DAY 014</div>
          <div style={{display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginTop:6}}>
            <div style={{fontFamily:'var(--display)', fontSize:36, fontWeight:700, letterSpacing:'-0.03em', lineHeight:0.95}}>
              How does it<br/><span style={{color:'var(--gold)'}}>feel today?</span>
            </div>
            <div style={{textAlign:'right', paddingTop:6}}>
              <div style={{fontFamily:'var(--display)', fontSize:32, fontWeight:600, color:'var(--gold)', letterSpacing:'-0.03em', lineHeight:1}}>28</div>
              <div style={{fontFamily:'var(--mono)', fontSize:9, color:'var(--ink3)', letterSpacing:'0.16em', marginTop:2}}>JAN ·26</div>
            </div>
          </div>
        </div>
        <div className="hr-bold"/>

        {/* Rating sections — type-led, no buttons */}
        {Object.entries(r).map(([k, v], i, arr) => (
          <div key={k} style={{padding:'22px 22px', borderBottom: i < arr.length-1 ? '1px solid var(--rule)' : 'none'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:14}}>
              <div>
                <span style={{fontFamily:'var(--mono)', fontSize:10, color:'var(--ink3)', letterSpacing:'0.14em'}}>{String(i+1).padStart(2,'0')} ·</span>
                <span style={{fontFamily:'var(--display)', fontSize:20, fontWeight:600, letterSpacing:'-0.02em', marginLeft:8}}>{k}</span>
              </div>
              <span style={{fontFamily:'var(--body)', fontSize:13, fontWeight:600, letterSpacing:'0.01em', color: v >= 4 ? 'var(--jade)' : v <= 2 ? 'var(--crimson)' : 'var(--gold)'}}>
                {labels[v-1]}
              </span>
            </div>
            {/* segmented rating - hairline tracks */}
            <div style={{display:'flex', gap:6}}>
              {[1,2,3,4,5].map(n => (
                <div key={n} onClick={()=>setR(s=>({...s, [k]:n}))} style={{
                  flex:1, cursor:'pointer', position:'relative', paddingTop:14,
                }}>
                  <div style={{
                    height: n === v ? 4 : 2,
                    background: n === v ? (v >= 4 ? 'var(--jade)' : v <= 2 ? 'var(--crimson)' : 'var(--gold)') : 'var(--rule-bold)',
                    transition:'all 0.2s',
                    boxShadow: n === v ? `0 0 8px ${v >= 4 ? 'var(--jade)' : v <= 2 ? 'var(--crimson)' : 'var(--gold)'}` : 'none',
                  }}/>
                  <div style={{
                    fontFamily:'var(--mono)', fontSize:10, color: n === v ? 'var(--ink)' : 'var(--ink3)',
                    marginTop:6, fontWeight: n === v ? 600 : 400, letterSpacing:'0.05em',
                  }}>{n}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
        <div className="hr-bold"/>

        {/* Doses */}
        <div style={{padding:'22px 22px 8px'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:14}}>
            <div className="eyebrow">DOSES TODAY</div>
            <div style={{fontFamily:'var(--mono)', fontSize:10, color:'var(--ink2)'}}>2/3</div>
          </div>
          {[
            {n:'Argireline 0.5mL', t:'08:14', done:true},
            {n:'GHK-Cu 0.3mL', t:'08:16', done:true},
            {n:'BPC-157 0.5mL', t:'PENDING', done:false},
          ].map((d, i, a) => (
            <div key={d.n} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 0', borderBottom: i < a.length-1 ? '1px solid var(--rule)' : 'none'}}>
              <div style={{display:'flex', alignItems:'center', gap:12}}>
                <div style={{
                  width:18, height:18, borderRadius:50,
                  border:'1px solid', borderColor: d.done ? 'var(--gold)' : 'var(--rule-bold)',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  background: d.done ? 'var(--gold)' : 'transparent', color: 'var(--bg)'
                }}>
                  {d.done && React.cloneElement(I.check, {style:{width:11, height:11}})}
                </div>
                <span style={{fontFamily:'var(--display)', fontSize:14, fontWeight:500, color: d.done ? 'var(--ink)' : 'var(--ink2)'}}>{d.n}</span>
              </div>
              <span style={{fontFamily:'var(--mono)', fontSize:10, color: d.done ? 'var(--gold)' : 'var(--ink3)', letterSpacing:'0.12em'}}>{d.t}</span>
            </div>
          ))}
        </div>

        {/* Notes */}
        <div style={{padding:'18px 22px'}}>
          <div className="eyebrow" style={{marginBottom:10}}>FIELD NOTES</div>
          <textarea placeholder="Reactions, observations, what you noticed…" style={{
            width:'100%', minHeight:80, background:'transparent',
            border:'none', borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)',
            color:'var(--ink2)', fontFamily:'var(--body)', fontSize:14, fontWeight:400, padding:'14px 0', resize:'none', outline:'none',
            caretColor:'var(--gold)'
          }}/>
        </div>

        <div style={{padding:'8px 22px 0'}}>
          <button className="btn">
            <span>Save check-in</span>
            <span className="arrow">→</span>
          </button>
          <div style={{textAlign:'center', marginTop:14, fontFamily:'var(--mono)', fontSize:9, color:'var(--ink3)', letterSpacing:'0.16em'}}>
            +120 XP · STREAK PROTECTED
          </div>
        </div>
        <div style={{height:24}}/>
      </div>
      <Tabs active="log"/>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   STACK — protocol detail

  return (

          <div style={{fontFamily:'var(--display)', fontSize:36, fontWeight:700, letterSpacing:'-0.03em', lineHeight:0.95, marginTop:6}}>

              <div style={{fontFamily:'var(--display)', fontSize:32, fontWeight:600, letterSpacing:'-0.03em', lineHeight:1, color: i===2 ? 'var(--gold)' : 'var(--ink)'}}>{m.v}</div>

        {/* Stack items */}

            <div style={{fontFamily:'var(--display)', fontSize:26, fontWeight:700, letterSpacing:'-0.03em', lineHeight:1, marginBottom:4}}>{p.name}</div>
            <div style={{fontFamily:'var(--body)', fontSize:13, color:'var(--ink3)', marginBottom:16, fontWeight:500, letterSpacing:'0.01em'}}>{p.sub}</div>

        <div style={{padding:'24px 22px 0'}}>
          <button className="btn">

/* ════════════════════════════════════════════════════════════
   APP
   ════════════════════════════════════════════════════════════ */
function App() {
  const screens = [
    {id:'home', label:'Home / Today', no:'01', comp: <Home/>},
    {id:'stack', label:'Stack', no:'02', comp: <Stack/>},
    {id:'scan', label:'Face Scan', no:'03', comp: <Scan/>},
    {id:'progress', label:'Progress', no:'04', comp: <Progress/>},
    {id:'log', label:'Daily Log', no:'05', comp: <Log/>},
    {id:'lib', label:'Library', no:'06', comp: <Library/>},
  ];

  return (
    <div className="stage">
      {screens.map(s => (
        <div key={s.id} className="phone-wrap">
          <IOSDevice dark={true}>
            {s.comp}
          </IOSDevice>
          <div className="phone-tag">
            <span className="num">{s.no}</span>
            <span>{s.label}</span>
          </div>
        </div>
      ))}

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
