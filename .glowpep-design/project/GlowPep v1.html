<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {

  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;

}
.stage {

  gap: 32px;
  padding: 48px 40px;
  align-items: flex-start;
}
.phone-label {
  text-align: center;
  margin-top: 16px;

  font-weight: 600;
  letter-spacing: 0.12em;

/* ── DESIGN TOKENS ── */
:root {
  --bg: #0C0C15;
  --bg2: #12121E;
  --card: rgba(255,255,255,0.05);
  --card-border: rgba(255,255,255,0.09);
  --gold: #E8B94F;
  --gold-dim: rgba(232,185,79,0.15);
  --gold-glow: rgba(232,185,79,0.35);
  --cyan: #3DE8C8;
  --cyan-dim: rgba(61,232,200,0.12);
  --text: #F2F0FF;
  --text2: rgba(242,240,255,0.5);
  --text3: rgba(242,240,255,0.28);
  --mono: 'Space Mono', monospace;
}

/* ── SCREEN BASE ── */
.screen {
  width: 100%;
  height: 100%;
  background: var(--bg);
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
}
.screen-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  padding-bottom: 80px;
}
.screen-scroll::-webkit-scrollbar { display: none; }

/* ── STATUS BAR ── */
.status { height: 44px; flex-shrink: 0; }

/* ── NAV BAR ── */
.navbar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 80px;
  background: rgba(12,12,21,0.92);
  backdrop-filter: blur(24px);
  border-top: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 8px 16px;
  z-index: 50;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  flex: 1;
  opacity: 0.4;
  transition: opacity 0.2s;
}
.nav-item.active { opacity: 1; }
.nav-item svg { width: 22px; height: 22px; }
.nav-item span {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text);
}
.nav-item.active span { color: var(--gold); }
.nav-item.active svg { filter: drop-shadow(0 0 6px var(--gold-glow)); }

/* camera FAB */
.nav-cam {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 24px var(--gold-glow), 0 4px 16px rgba(0,0,0,0.4);
  cursor: pointer;
  flex-shrink: 0;
  margin-top: -8px;
}
.nav-cam svg { width: 24px; height: 24px; color: #0C0C15; }

/* ── GLASS CARD ── */
.glass {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 20px;
  backdrop-filter: blur(12px);
}
.glass-gold {
  background: rgba(232,185,79,0.07);
  border: 1px solid rgba(232,185,79,0.2);
  border-radius: 20px;
}
.glass-cyan {
  background: rgba(61,232,200,0.06);
  border: 1px solid rgba(61,232,200,0.18);
  border-radius: 20px;
}

/* ── SECTION LABEL ── */

  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;

/* ── PROGRESS BAR ── */

  background: rgba(255,255,255,0.08);
  border-radius: 99px;
  overflow: hidden;
}
.prog-fill {

/* ── GLOW BLOB bg ── */

  border-radius: 50%;
  filter: blur(80px);

}

/* ─── RADAR CHART ─── */
function RadarChart({ data }) {
  const cx = 90, cy = 90, r = 65;
  const labels = data.map(d => d.label);
  const vals = data.map(d => d.val / 100);
  const n = data.length;
  const angle = i => (Math.PI * 2 * i / n) - Math.PI / 2;
  const pt = (i, radius) => [cx + radius * Math.cos(angle(i)), cy + radius * Math.sin(angle(i))];

  const webs = [0.25, 0.5, 0.75, 1].map(scale =>
    labels.map((_,i) => pt(i, r * scale)).map((p,i) => (i===0?'M':'L')+p[0]+' '+p[1]).join(' ') + 'Z'
  );
  const shape = vals.map((v,i) => pt(i, r * v)).map((p,i) => (i===0?'M':'L')+p[0]+' '+p[1]).join(' ') + 'Z';

  return (
    <svg width="180" height="180" viewBox="0 0 180 180">
      {webs.map((d,i) => <path key={i} d={d} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth="1"/>)}
      {labels.map((_,i) => {
        const [x1,y1] = pt(i,0); const [x2,y2] = pt(i,r);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="rgba(255,255,255,0.07)" strokeWidth="1"/>;
      })}
      <path d={shape} fill="rgba(232,185,79,0.15)" stroke="#E8B94F" strokeWidth="1.5"/>
      {vals.map((v,i) => {
        const [x,y] = pt(i, r*v);
        return <circle key={i} cx={x} cy={y} r="3.5" fill="#E8B94F" style={{filter:'drop-shadow(0 0 4px rgba(232,185,79,0.8))'}}/>;
      })}
      {labels.map((lbl,i) => {
        const [x,y] = pt(i, r+14);
        return <text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="middle" fill="rgba(242,240,255,0.5)" fontSize="9" fontFamily="Space Grotesk" fontWeight="600">{lbl}</text>;
      })}
    </svg>
  );
}

              </div>
              <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--gold)',letterSpacing:'0.1em',marginBottom:10}}>QUESTION {quizStep} / {questions.length}</div>
              <div style={{fontSize:22,fontWeight:700,marginBottom:20,lineHeight:1.3}}>{questions[quizStep-1].q}</div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {questions[quizStep-1].opts.map(opt => (
                  <div key={opt} onClick={()=>quizStep<questions.length?setQuizStep(q=>q+1):null} className="glass" style={{
                    padding:'14px 16px',cursor:'pointer',fontSize:14,fontWeight:600,
                    display:'flex',alignItems:'center',justifyContent:'space-between'
                  }}>
                    {opt} <IconArrow/>
                  </div>
                ))}
              </div>
              <div onClick={()=>setQuizStep(0)} style={{marginTop:20,textAlign:'center',fontSize:13,color:'var(--text3)',cursor:'pointer'}}>← Back to Stack</div>
            </div>
          </>
        )}
      </div>
      <NavBar active="stack" onNav={()=>setQuizStep(0)}/>
    </div>
  );
}

/* ─── APP ─── */
function App() {
  const screens = [
    {id:'home', label:'Home', comp: <HomeScreen/>},
    {id:'stack', label:'Stack', comp: <StackScreen/>},
    {id:'scan', label:'Face Scan', comp: <ScanScreen/>},
    {id:'log', label:'Daily Log', comp: <LogScreen/>},
    {id:'progress', label:'Progress', comp: <ProgressScreen/>},
    {id:'library', label:'Library', comp: <LibraryScreen/>},
  ];

  return (
    <div className="stage">
      {screens.map(s => (
        <div key={s.id}>
          <IOSDevice dark={true}>
            {s.comp}
          </IOSDevice>
          <div className="phone-label">{s.label}</div>
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
